<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>我的照片牆</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

h1 {
    text-align: center;
    padding: 20px;
}

.upload-box {
    text-align: center;
    margin: 20px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    padding: 20px;
}

.gallery img {
    width: 100%;
    border-radius: 10px;
    cursor: pointer;
}

/* 彈窗 */
.modal {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    top: 0;
    left: 0;
}

.modal-content {
    background: white;
    margin: 5% auto;
    padding: 20px;
    width: 80%;
    max-width: 600px;
}

.close {
    float: right;
    cursor: pointer;
    font-size: 20px;
}

.comment {
    background: #eee;
    margin-top: 5px;
    padding: 5px;
}
</style>

</head>

<body>

<h1>📷 我的照片牆</h1>

<div class="upload-box">
    <input type="file" id="upload">
</div>

<div class="gallery" id="gallery"></div>

<!-- 彈窗 -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">X</span>
        <img id="modalImg" style="width:100%">
        
        <h3>留言</h3>
        <input id="name" placeholder="名字">
        <textarea id="msg" placeholder="留言"></textarea>
        <button onclick="addComment()">送出</button>

        <div id="commentList"></div>
    </div>
</div>

<script>
let currentImg = "";

/* 📷 上傳圖片（會儲存） */
document.getElementById("upload").addEventListener("change", function(e) {
    let file = e.target.files[0];
    let reader = new FileReader();

    reader.onload = function(event) {
        let imgData = event.target.result;

        let images = JSON.parse(localStorage.getItem("images")) || [];
        images.push(imgData);
        localStorage.setItem("images", JSON.stringify(images));

        showImages();
    }

    reader.readAsDataURL(file);
});

/* 📷 顯示圖片（從localStorage讀） */
function showImages() {
    let gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    let images = JSON.parse(localStorage.getItem("images")) || [];

    images.forEach(src => {
        let img = document.createElement("img");
        img.src = src;

        img.onclick = function() {
            openModal(src);
        };

        gallery.appendChild(img);
    });
}

/* 📷 開啟圖片 */
function openModal(src) {
    document.getElementById("modal").style.display = "block";
    document.getElementById("modalImg").src = src;
    currentImg = src;
    loadComments();
}

/* 關閉 */
function closeModal() {
    document.getElementById("modal").style.display = "none";
}

/* 💬 新增留言（會儲存） */
function addComment() {
    let name = document.getElementById("name").value;
    let msg = document.getElementById("msg").value;

    if (!name || !msg) return;

    let data = JSON.parse(localStorage.getItem(currentImg)) || [];
    data.push({name, msg});
    localStorage.setItem(currentImg, JSON.stringify(data));

    document.getElementById("name").value = "";
    document.getElementById("msg").value = "";

    loadComments();
}

/* 💬 顯示留言 */
function loadComments() {
    let list = document.getElementById("commentList");
    list.innerHTML = "";

    let data = JSON.parse(localStorage.getItem(currentImg)) || [];

    data.forEach(d => {
        let div = document.createElement("div");
        div.className = "comment";
        div.innerText = d.name + "： " + d.msg;
        list.appendChild(div);
    });
}

/* 🔥 一進網站就載入圖片 */
showImages();
</script>

</body>
</html>
